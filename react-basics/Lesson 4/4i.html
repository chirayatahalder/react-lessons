<!doctype html>
<html>

<head>
  <title>4i</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    div {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background-color: rgb(222, 222, 222);
    }

    div button {
      background-color: rgb(25, 135, 84);
      padding: 16px 24px;
      color: #fff;
      outline: none;
      border: none;
      cursor: pointer;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">
    function App() {
      const [count, setCount] = React.useState(0);
      const [isAutoClicking, setIsAutoClicking] = React.useState(false);
      const intervalIdRef = React.useRef(null);

      function handleClick() {
        setCount(count + 1);
      }

      function handleReset() {
        setCount(0);
      }

      function handleAutoClick() {
        if (!isAutoClicking) {
          setIsAutoClicking(true);
          const intervalId = setInterval(() => {
            setCount((prevCount) => prevCount + 1);
          }, 1000);
          intervalIdRef.current = intervalId;
        } else {
          setIsAutoClicking(false);
          clearInterval(intervalIdRef.current);
          intervalIdRef.current = null;
        }
      }

      return (
        <div className="div">
          <button onClick={handleClick}>Clicked {count} Time</button>
          <button onClick={handleReset}>Reset</button>
          <button onClick={handleAutoClick}>
            {isAutoClicking ? "Stop Auto Click" : "Start Auto Click"}
          </button>
        </div>
      );
    }

    const container = document.querySelector(".js-container");
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>

</html>
